apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubecounter-route
  namespace: kubecounter
spec:
  parentRefs:
  - name: mpes-gateway
    namespace: istio-system
  hostnames:
  - "kubecounter.mmlabs.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
        backendRefs:
        - name: kubecounter-api-svc
          port: 8080

      - matches:
        - path:
            type: PathPrefix
            value: /
        backendRefs:
        - name: kubecounter-client-svc
          port: 80
