apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecounter-client
  namespace: kubecounter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecounter-client
  template:
    metadata:
      labels:
        app: kubecounter-client
    spec:
      containers:
        - name: kubecounter-client
          image: mmaous/kubecounter:client
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_BASE_URL
              value: http://kubecounter-svc:8080
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "500m"
